
<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Met kocke</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        .kocka {
            width: 100px;
            height: 100px;
            background-color: #667eea;
            color: white;
            font-size: 50px;
            font-weight: bold;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 20px;
            color: #444;
        }

        .rezultat {
            color: #667eea;
            font-weight: bold;
            font-size: 28px;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #4b5fc7;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎲 Met kocke</h1>

        <div class="kocka" id="kocka">
            {{ kocka }}
        </div>

        <p>Vrgel si:</p>
        <div class="rezultat" id="rezultat">
            {{ kocka }}
        </div>

        <br>

        <button onclick="metKocke()">Vrzi kocko</button>
    </div>

    <script>
        function metKocke() {
            let kocka = Math.floor(Math.random() * 6) + 1;

            document.getElementById("kocka").textContent = kocka;
            document.getElementById("rezultat").textContent = kocka;
        }
    </script>

</body>
</html>
